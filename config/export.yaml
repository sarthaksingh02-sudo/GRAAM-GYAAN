# config/export.yaml
# PDF and Text Export configuration and template settings

fonts:
  devanagari_font_name: "NotoSansDevanagari"
  devanagari_font_file: "assets/fonts/NotoSansDevanagari-Regular.ttf"
  fallback_font: "Helvetica"

layout:
  page_size: "A4"
  margin_mm: 15
  title_font_size: 20
  heading_font_size: 14
  body_font_size: 10
  caption_font_size: 8
  primary_color: "#1B5E20" # Dark Forest Green
  accent_color: "#E65100"  # Saffron / Orange
  border_color: "#BDBDBD"

templates:
  text_template_file: "templates/export_template.txt"

headers:
  hi-IN: "ग्राम-ज्ञान 🌾 — ग्रामीण कल्याण एवं योजना सारांश"
  en-IN: "GRAAM-GYAAN 🌾 — Rural Welfare & Family Summary Report"

footers:
  hi-IN: "सत्यापित स्रोतों से जनित रिपोर्ट • गोपनीयता सुरक्षित (पहचान संख्याएं पूर्णतः मास्क की गई हैं)"
  en-IN: "Generated from verified government data • Privacy protected (all IDs masked)"

disclaimer:
  hi-IN: "यह दस्तावेज़ ग्राम-ज्ञान AI सहायक द्वारा ग्रामीण नागरिक सहायता हेतु तैयार किया गया है। सभी योजना नियम आधिकारिक सरकारी पोर्टलों द्वारा सत्यापित हैं। अंतिम लाभ वितरण संबंधित विभाग की स्वीकृति पर निर्भर है।"
  en-IN: "This report is generated by GRAAM-GYAAN for citizen assistance. Scheme rules are verified from official government portals. Final benefit approval is subject to departmental verification."
